apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio-website-ingress-staging
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - portfolio.prashantgawali.site
    secretName: portfolio-website-tls-staging
  rules:
  - host: portfolio.prashantgawali.site
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: portfolio-website
            port:
              number: 80
