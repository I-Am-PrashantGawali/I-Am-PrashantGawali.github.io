apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-website
  labels:
    app: portfolio-website
    app.kubernetes.io/name: portfolio-website
    app.kubernetes.io/instance: portfolio-website
spec:
  replicas: 2
  selector:
    matchLabels:
      app: portfolio-website
  template:
    metadata:
      labels:
        app: portfolio-website
        app.kubernetes.io/name: portfolio-website
        app.kubernetes.io/instance: portfolio-website
    spec:
      containers:
      - name: portfolio-website
        image: 132551339390.dkr.ecr.us-east-1.amazonaws.com/portfolio-website:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
